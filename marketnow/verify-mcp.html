<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCP Endpoint Verifier</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e8e8e8; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: #111; border: 1px solid #333; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        pre { background: #000; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.9rem; color: #a892ff; }
        button { background: #4ade80; color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #22c55e; }
    </style>
</head>
<body>
    <h1>MCP Endpoint Verifier 🤖</h1>
    <p>Target: <code>https://marketnow.site/api/mcp</code></p>
    
    <div class="card" id="sse-card">
        <h3>1. SSE Connection (Handshake)</h3>
        <p id="sse-status">Connecting...</p>
        <pre id="sse-log"></pre>
    </div>

    <div class="card" id="post-card" style="display: none;">
        <h3>2. Protocol Test (tools/list)</h3>
        <button id="btn-test">Execute tools/list via POST</button>
        <p id="post-status" style="margin-top: 1rem;"></p>
        <pre id="post-log"></pre>
    </div>

    <script>
        const sseLog = document.getElementById('sse-log');
        const sseStatus = document.getElementById('sse-status');
        const postCard = document.getElementById('post-card');
        const postLog = document.getElementById('post-log');
        const postStatus = document.getElementById('post-status');

        function logSSE(msg) { sseLog.textContent += msg + '\n'; }
        function logPOST(msg) { postLog.textContent = msg; }

        // 1. Connect via SSE
        const eventSource = new EventSource('https://marketnow.site/api/mcp');
        
        eventSource.onopen = () => {
            sseStatus.innerHTML = '<span class="success">✅ SSE Connection Established (200 OK, keeping alive)</span>';
            logSSE('[System] SSE stream opened. Waiting for events...');
            postCard.style.display = 'block';
        };

        eventSource.onerror = (err) => {
            sseStatus.innerHTML = '<span class="error">❌ SSE Connection Failed</span>';
            logSSE('[Error] Connection dropped or failed.');
        };

        eventSource.addEventListener('endpoint', (e) => {
            logSSE('[Event: endpoint] Received POST endpoint: ' + e.data);
        });

        // 2. Test POST command
        document.getElementById('btn-test').onclick = async () => {
            postStatus.textContent = 'Sending JSON-RPC request...';
            try {
                const res = await fetch('https://marketnow.site/api/mcp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        id: 1,
                        method: "tools/list",
                        params: {}
                    })
                });
                const data = await res.json();
                postStatus.innerHTML = '<span class="success">✅ POST executed successfully!</span>';
                logPOST(JSON.stringify(data, null, 2));
            } catch (err) {
                postStatus.innerHTML = '<span class="error">❌ POST failed</span>';
                logPOST(err.message);
            }
        };
    </script>
</body>
</html>
