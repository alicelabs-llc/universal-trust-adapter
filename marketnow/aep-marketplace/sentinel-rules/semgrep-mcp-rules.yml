# MarketNow — MCP-specific Semgrep Rules
# ========================================
# 29 rules for MCP server security audit.
# Used by Sentinel L1.6 (GitHub Actions batch) and available for manual runs.
# v2 (2026-09-09): +11 rules — tool poisoning (MCP-TP), exfiltration chains
# (MCP-EX), multi-step attack chains (MCP-AC), stale-trust caching (MCP-RR).
# Aligned with OWASP MCP Cheat Sheet + roadmap v5.1 (fingerprinting/revocation)
# and previews v5.4 (trajectory / multi-tool attack chains).

rules:
  # Prompt Injection (6 rules)
  - id: MCP-PI-001
    message: "Prompt injection: 'ignore previous instructions' detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "ignore\\s+(?:all\\s+)?(?:previous|prior)\\s+instructions"

  - id: MCP-PI-002
    message: "Prompt injection: 'disregard the above' detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "disregard\\s+(?:the\\s+)?(?:above|previous)"

  - id: MCP-PI-003
    message: "Prompt injection: 'you are now' role override detected"
    severity: WARNING
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "you\\s+are\\s+now\\s+(?:a|an)\\s+(?:different|new|admin|root)"

  - id: MCP-PI-004
    message: "Prompt injection: 'forget everything' detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "forget\\s+(?:everything|all|your\\s+instructions)"

  - id: MCP-PI-005
    message: "Prompt injection: exfiltration instructions detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:exfiltrate|steal|send).*(?:to|via).*(?:email|webhook|discord|telegram|api)"

  - id: MCP-PI-006
    message: "Prompt injection: system override command detected"
    severity: WARNING
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:/system|/admin|/debug|/exec|/eval|/shell)"

  # Command Injection (4 rules)
  - id: MCP-CI-001
    message: "Command injection: exec() with user input"
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: exec($REQ)
      - pattern: execSync($REQ)

  - id: MCP-CI-002
    message: "Command injection: os.system with user input"
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: os.system($REQ)
      - pattern: subprocess.call($REQ, shell=True)

  - id: MCP-CI-003
    message: "Dangerous: eval() with dynamic input"
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: eval($REQ)

  - id: MCP-CI-004
    message: "Dangerous: child_process with string concatenation"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern: child_process.exec("..." + $X)

  # Secret Leakage (2 rules)
  - id: MCP-SL-001
    message: "Hardcoded API key detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:api[_-]?key|api[_-]?secret)\\s*[:=]\\s*['\"][a-zA-Z0-9]{20,}['\"]"

  - id: MCP-SL-002
    message: "Wallet mnemonic detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:mnemonic|seed[_-]?phrase|private[_-]?key)\\s*[:=]\\s*['\"][a-z\\s]{20,}['\"]"

  # SSRF (2 rules)
  - id: MCP-SS-001
    message: "SSRF: fetch with user-controlled URL"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern: fetch($REQ.URL)
      - pattern: axios.get($REQ.URL)

  - id: MCP-SS-002
    message: "SSRF: internal IP access detected"
    severity: WARNING
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:169\\.254\\.169\\.254|localhost|127\\.0\\.0\\.1)"

  # Path Traversal (2 rules)
  - id: MCP-PT-001
    message: "Path traversal: readFile with user input"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern: fs.readFile($REQ.path)

  - id: MCP-PT-002
    message: "Path traversal: directory traversal pattern detected"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "\\.\\./(?:\\.\\.\\/)*(?:etc|var|root|home|proc)"

  # Tool Spoofing (1 rule)
  - id: MCP-TS-001
    message: "Tool name spoofing: impersonating system tool"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-regex: "(?:name|toolName)\\s*[:=]\\s*['\"](?:read_file|write_file|system|exec|shell|admin)['\"]"

  # Missing inputSchema (1 rule)
  - id: MCP-IS-001
    message: "Missing inputSchema on tool registration"
    severity: INFO
    languages: [javascript, typescript]
    patterns:
      - pattern: registerTool($NAME, $DESC)
        pattern-not: 'registerTool($NAME, $DESC, ..., inputSchema: ...)'

  # ─────────────────────────────────────────────────────────────
  # v2 (2026-09-09) — 11 new rules
  # ─────────────────────────────────────────────────────────────

  # Tool Poisoning (4 rules) — the rug-pull class this repo's
  # marketnow_fingerprint_tool (TFP-1.0) defends against at runtime.
  - id: MCP-TP-001
    message: "Tool poisoning: tool description contains agent-directed instructions (description injection)"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "description[\\s\\S]{0,40}(?:IMPORTANT[:!]|NOTE TO (?:THE )?(?:AGENT|LLM)|do not tell|don't tell|secretly|without (?:the )?user(?:'s)? (?:knowledge|consent))"

  - id: MCP-TP-002
    message: "Tool poisoning: hidden/invisible unicode (zero-width, bidi override, tag chars) in tool description or name"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:\\u200b|\\u200c|\\u200d|\\u202a|\\u202b|\\u202c|\\u202d|\\u202e|\\u2066|\\u2067|\\u2068|\\u2069|\\ufeff)"

  - id: MCP-TP-003
    message: "Tool poisoning: description mutated after registration (dynamic description override — fingerprint drift at source level)"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-regex: "(?:tool|tools?)\\[[^\\]]*\\]\\s*[.]\\s*(?:description|inputSchema)\\s*="

  - id: MCP-TP-004
    message: "Tool poisoning: conditional tool behavior based on caller/context (tool behaves differently when audited)"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:isAudited|is_audit|isTest|is_test|auditMode|sandbox_mode)\\s*(?:===?|==)\\s*(?:true|false)"

  # Environment/Credential Exfiltration Chains (3 rules)
  - id: MCP-EX-001
    message: "Exfiltration chain: process.env serialized then sent over network"
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-regex: "(?:JSON[.]stringify|util[.]inspect)\\s*\\(\\s*(?:process[.]env|env)\\s*\\)"

  - id: MCP-EX-002
    message: "Credential exfiltration: agent-runtime credential paths accessed (~/.claude, ~/.openclaw, ~/.cursor, MCP auth stores)"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:~|\\$HOME|%USERPROFILE%|os[.]homedir\\(\\))[/\\\\.]{0,2}\\.(?:claude|openclaw|cursor|continue|config|local/share|mcp)"

  - id: MCP-EX-003
    message: "Exfiltration chain: env/mnemonic + outbound webhook in same file"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:process[.]env|os[.]environ)[\\s\\S]{0,400}(?:webhook|discord(?:app)?[.]com/api|hooks[.]slack|api[.]telegram[.]org|pastebin[.]com)"

  # Multi-Step Attack Chains (3 rules) — roadmap v5.4 preview:
  # each individual action may be ALLOW; the CHAIN is the attack.
  - id: MCP-AC-001
    message: "Attack chain markers: download + execute primitives in the same module"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:download|fetch|http[s]?[.]get|requests?[.]get)[\\s\\S]{0,300}(?:child_process|spawn|exec(?:Sync)?|subprocess|os[.]system|eval\\()"

  - id: MCP-AC-002
    message: "Attack chain markers: base64/hex decode feeding eval/exec"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:atob|base64|b64decode|Buffer[.]from\\([^)]*['\"](?:base64|hex)['\"]\\))[\\s\\S]{0,200}(?:eval\\(|new Function\\(|exec(?:Sync)?|child_process)"

  - id: MCP-AC-003
    message: "Attack chain markers: secret-file read + archive/encode + network send primitives"
    severity: ERROR
    languages: [javascript, typescript, python]
    patterns:
      - pattern-regex: "(?:\\.(?:env|ssh|aws|npmrc|git-credentials))[\\s\\S]{0,400}(?:readFile|read)[\\s\\S]{0,400}(?:fetch|axios|http[s]?[.]request|requests?[.]post)"

  # Stale Trust Caching (1 rule) — revocation-aware clients (v5.1.5)
  - id: MCP-RR-001
    message: "Stale trust: trust/verification verdict cached without re-check or TTL — revoked credentials keep passing"
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-regex: "(?:trustCache|verifyCache|cache)\\[[^\\]]*\\]\\s*=\\s*(?:true|\\{[^}]*(?:valid|trusted)[^}]*\\})"
