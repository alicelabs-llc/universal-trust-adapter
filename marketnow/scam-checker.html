<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTA Scam Checker — Is this URL a scam?</title>
<meta name="description" content="Free domain reputation checker. No API key, no registration. Transparent heuristics. Your AI recommended a store. Is it a scam?">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 800px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 3rem; }
  .header h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .header .subtitle { color: #888; font-size: 1.1rem; }
  .header .tagline {
    color: #ec4899;
    font-weight: 600;
    margin-top: 1rem;
    font-size: 1.2rem;
  }
  .checker-box {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
  }
  .input-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 1rem;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #6366f1; }
  button {
    padding: 1rem 2rem;
    background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .examples {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .example-btn {
    padding: 0.4rem 0.8rem;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    color: #888;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .example-btn:hover { color: #6366f1; border-color: #6366f1; }
  .result {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 2rem;
    display: none;
  }
  .result.show { display: block; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .decision-badge {
    padding: 0.5rem 1.5rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1rem;
    text-transform: uppercase;
  }
  .decision-TRUSTED { background: #064e3b; color: #34d399; }
  .decision-CAUTION { background: #451a03; color: #fbbf24; }
  .decision-SUSPICIOUS { background: #450a0a; color: #f87171; }
  .decision-UNKNOWN { background: #1e293b; color: #94a3b8; }
  .risk-meter {
    height: 8px;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  .risk-fill {
    height: 100%;
    background: linear-gradient(90deg, #34d399 0%, #fbbf24 50%, #f87171 100%);
    transition: width 0.5s ease;
  }
  .reasons { margin-bottom: 1.5rem; }
  .reasons h3 { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.75rem; letter-spacing: 0.5px; }
  .reason {
    background: #1a0a0a;
    border-left: 3px solid #f87171;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  .checks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .check-item {
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.85rem;
  }
  .check-item.triggered { border-color: #f87171; background: #1a0a0a; }
  .check-item.passed { border-color: #34d399; }
  .check-name { font-weight: 600; color: #ccc; margin-bottom: 0.25rem; }
  .check-detail { color: #888; }
  .disclaimer {
    background: #1a1a2e;
    border: 1px solid #312e51;
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.85rem;
    color: #a8a8c0;
    margin-top: 1.5rem;
  }
  .disclaimer strong { color: #c4b5fd; }
  .api-link {
    text-align: center;
    margin-top: 2rem;
    color: #666;
    font-size: 0.9rem;
  }
  .api-link a { color: #6366f1; text-decoration: none; }
  .api-link a:hover { text-decoration: underline; }
  .loading {
    text-align: center;
    padding: 2rem;
    color: #888;
  }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #333;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>UTA Scam Checker</h1>
    <div class="subtitle">Free domain reputation check. No API key. No registration.</div>
    <div class="tagline">Your AI recommended a store. Is it a scam?</div>
  </div>

  <div class="checker-box">
    <div class="input-row">
      <input type="text" id="domainInput" placeholder="example.com or https://suspicious-site.xyz" onkeypress="if(event.key==='Enter')checkDomain()">
      <button onclick="checkDomain()" id="checkBtn">Check</button>
    </div>
    <div class="examples">
      <span style="color:#666;font-size:0.85rem;margin-right:0.5rem;">Try:</span>
      <button class="example-btn" onclick="loadExample('google.com')">google.com</button>
      <button class="example-btn" onclick="loadExample('bit.ly/abc')">bit.ly</button>
      <button class="example-btn" onclick="loadExample('amaz0n-login.xyz')">amaz0n-login.xyz</button>
      <button class="example-btn" onclick="loadExample('paypa1-secure.com')">paypa1-secure.com</button>
      <button class="example-btn" onclick="loadExample('xn--pple-43d.com')">xn--pple-43d.com</button>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    <p style="margin-top:1rem;">Checking domain...</p>
  </div>

  <div id="result" class="result"></div>

  <div class="api-link">
    <p>API: <code>GET /api/scam-check?domain=example.com</code></p>
    <p style="margin-top:0.5rem;">
      <a href="https://github.com/alicelabs-llc/universal-trust-adapter" target="_blank">GitHub</a> ·
      <a href="https://www.marketnow.site/api/trust" target="_blank">UTA API</a> ·
      <a href="https://t.me/uta_verify_bot" target="_blank">Telegram Bot</a> ·
      <a href="https://www.marketnow.site/translate.html">Credential Translator</a> ·
      <a href="https://www.marketnow.site/playground.html">Verify Playground</a>
    </p>
  </div>
</div>

<script>
async function checkDomain() {
  const input = document.getElementById('domainInput').value.trim();
  if (!input) return;
  
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  
  try {
    const resp = await fetch('https://www.marketnow.site/api/scam-check?domain=' + encodeURIComponent(input));
    const data = await resp.json();
    
    document.getElementById('loading').style.display = 'none';
    displayResult(data);
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').classList.add('show');
    document.getElementById('result').innerHTML = '<p style="color:#f87171;">Error: ' + err.message + '</p>';
  }
  
  btn.disabled = false;
}

function loadExample(domain) {
  document.getElementById('domainInput').value = domain;
  checkDomain();
}

function displayResult(data) {
  const resultDiv = document.getElementById('result');
  resultDiv.classList.add('show');
  
  const decisionClass = 'decision-' + data.decision;
  
  let html = `
    <div class="result-header">
      <div class="decision-badge ${decisionClass}">${data.decision}</div>
      <div style="color:#888;">Risk score: <strong style="color:#fff;">${data.risk_score}/100</strong></div>
    </div>
    <div class="risk-meter">
      <div class="risk-fill" style="width:${data.risk_score}%"></div>
    </div>
  `;
  
  if (data.reasons && data.reasons.length > 0) {
    html += '<div class="reasons"><h3>Reasons</h3>';
    data.reasons.forEach(r => {
      html += '<div class="reason">' + escapeHtml(r) + '</div>';
    });
    html += '</div>';
  } else if (data.decision === 'TRUSTED') {
    html += '<div class="reasons"><h3>Result</h3><div class="reason" style="background:#064e3b;border-left-color:#34d399;">Domain is in the trusted popular-domains list</div></div>';
  } else {
    html += '<div class="reasons"><h3>Result</h3><div class="reason" style="background:#1e293b;border-left-color:#94a3b8;">No heuristics triggered, but domain is not in trusted list either (UNKNOWN)</div></div>';
  }
  
  if (data.checks) {
    html += '<div class="reasons"><h3>All checks (transparent)</h3><div class="checks-grid">';
    for (const [name, check] of Object.entries(data.checks)) {
      const cls = check.triggered ? 'triggered' : 'passed';
      const icon = check.triggered ? '⚠️' : '✅';
      html += `
        <div class="check-item ${cls}">
          <div class="check-name">${icon} ${name.replace(/_/g, ' ')}</div>
          <div class="check-detail">${escapeHtml(check.detail)}</div>
        </div>
      `;
    }
    html += '</div></div>';
  }
  
  html += `
    <div class="disclaimer">
      <strong>⚠️ Honest disclaimer:</strong> ${escapeHtml(data.honest_disclaimer || 'Heuristic v1. No threat feeds.')}
      <br><br>
      <strong>Spec:</strong> <a href="${data.spec}" target="_blank" style="color:#6366f1;">GitHub repo</a> ·
      <strong>API:</strong> <code>${data.api}</code>
    </div>
  `;
  
  resultDiv.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
