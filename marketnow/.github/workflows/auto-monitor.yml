# MarketNow — Auto-Monitor (runs every hour)
# ============================================
# Monitors: dev.to comments, GitHub issue comments, npm downloads,
# GitHub stars, site uptime.
# Sends email to support@alicelabs.site when there's new activity.

name: Auto-Monitor

"on":
  schedule:
    # Every hour at minute 15
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time — prevents pile-up if a run hangs
concurrency:
  group: auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run auto-monitor
        env:
          # GITHUB_TOKEN is auto-provided by Actions — no secret needed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dev.to key is read-only and safe to commit as fallback
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          # Use secret if set, else fall back to hardcoded dev.to key
          # (dev.to key is read-only and safe to commit)
          export DEVTO_API_KEY="${DEVTO_API_KEY:-WYK9tdVMev3K7xwtbWxvkwNu}"
          export NOTIFY_EMAIL="${NOTIFY_EMAIL:-support@alicelabs.site}"
          export SMTP_USER="${SMTP_USER:-support@alicelabs.site}"

          python3 scripts/auto-monitor.py

      - name: Commit state
        run: |
          # Only commit if state file actually changed
          if [ -f .github/monitor-state.json ]; then
            git config user.name "MarketNow Monitor Bot"
            git config user.email "info@alicelabs.site"
            git add .github/monitor-state.json
            if git diff --cached --quiet; then
              echo "No state changes — skipping commit (BUG FIX: was committing every hour)"
            else
              git commit -m "chore: monitor state update [skip ci]" || true
              git push || echo "Push failed (will retry next hour)"
            fi
          fi
