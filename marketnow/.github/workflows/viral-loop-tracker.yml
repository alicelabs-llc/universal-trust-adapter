# MarketNow — 30-Day Viral Loop Tracker
# ========================================
#
# Runs 30 days after the v1.7.0 launch (August 25, 2026) and generates
# a public report of viral loop metrics for the follow-up dev.to article.
#
# Schedule: August 25, 2026 at 12:00 UTC (one-time)
# Manual: workflow_dispatch (any time)

name: 30-Day Viral Loop Tracker

on:
  schedule:
    - cron: '0 12 25 8 *'  # August 25 at 12:00 UTC (one-time, runs yearly but we only care about 2026)
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to report on (default 30)'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run viral loop tracker
        env:
          MANDATES_GITHUB_TOKEN: ${{ secrets.MANDATES_GITHUB_TOKEN }}
          MANDATES_REPO: edgarfloresguerra2011-a11y/marketnow
          NPM_PACKAGE: marketnow-mcp
        run: |
          DAYS_ARG="--days=${{ github.event.inputs.days || '30' }}"
          node scripts/viral-loop-tracker.mjs "$DAYS_ARG"
