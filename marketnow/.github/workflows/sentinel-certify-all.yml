# MarketNow — Sentinel Certify All Skills (Weekly)
# ==================================================
# Runs the full L1.5 + L1.6 + L2 audit on EVERY skill in the catalog
# (8582+ skills) and generates signed Sentinel certificates.
#
# Certificates are committed to _data/sentinel_certificates/{skillId}.json
# and served via /api/audit-skill?certificate=1&skillId=X.
#
# Schedule: weekly (Sunday 01:00 UTC, between L1.6 batch at 00:00 and
# L2 re-audit at 02:00).
#
# Manual trigger: workflow_dispatch with optional max_skills and skill_id inputs.

name: Sentinel Certify All Skills

on:
  schedule:
    - cron: '0 1 * * 0'  # Weekly Sunday 01:00 UTC
  workflow_dispatch:
    inputs:
      max_skills:
        description: 'Max skills to audit (0 = all 8582+)'
        required: false
        default: '0'
        type: string
      skill_id:
        description: 'Audit only this skill ID (leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # Required to commit certificates back to master

# Prevent overlapping weekly runs
concurrency:
  group: sentinel-certify-all
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours max — 8582 skills × ~200ms = ~30 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check SENTINEL_CERT_SECRET is set
        env:
          SENTINEL_CERT_SECRET: ${{ secrets.SENTINEL_CERT_SECRET }}
        run: |
          if [ -z "$SENTINEL_CERT_SECRET" ]; then
            echo "::error::SENTINEL_CERT_SECRET GitHub Actions secret is not set."
            echo "::error::The old default secret is PUBLIC in git history and must never be used."
            echo "::error::Set the secret in: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ SENTINEL_CERT_SECRET is set (length: ${#SENTINEL_CERT_SECRET})"

      - name: Run batch audit
        env:
          SENTINEL_CERT_SECRET: ${{ secrets.SENTINEL_CERT_SECRET }}
          MANDATES_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_SKILLS: ${{ github.event.inputs.max_skills || '0' }}
          ONLY_SKILL: ${{ github.event.inputs.skill_id || '' }}
        run: |
          ARGS=""
          if [ "$MAX_SKILLS" != "0" ] && [ -n "$MAX_SKILLS" ]; then
            ARGS="$ARGS --max $MAX_SKILLS"
          fi
          if [ -n "$ONLY_SKILL" ]; then
            ARGS="$ARGS --skill $ONLY_SKILL"
          fi

          echo "Running batch audit with args: $ARGS"
          node scripts/audit-all-skills.mjs $ARGS

      - name: Commit certificates
        run: |
          # Check if any certificates were generated
          CERT_COUNT=$(find _data/sentinel_certificates -name "*.json" 2>/dev/null | wc -l)
          echo "Certificates generated: $CERT_COUNT"

          if [ "$CERT_COUNT" -eq 0 ]; then
            echo "No certificates to commit. Exiting."
            exit 0
          fi

          git config user.name "Sentinel Cert Bot"
          git config user.email "support@alicelabs.site"

          # Add all certificates
          git add _data/sentinel_certificates/

          # Build commit message with stats from the audit
          LOW=$(find _data/sentinel_certificates -name "*.json" -exec grep -l '"risk_level": "low"' {} \; | wc -l)
          MEDIUM=$(find _data/sentinel_certificates -name "*.json" -exec grep -l '"risk_level": "medium"' {} \; | wc -l)
          HIGH=$(find _data/sentinel_certificates -name "*.json" -exec grep -l '"risk_level": "high"' {} \; | wc -l)
          CRITICAL=$(find _data/sentinel_certificates -name "*.json" -exec grep -l '"risk_level": "critical"' {} \; | wc -l)

          git commit -m "sentinel: weekly batch certification — $CERT_COUNT skills

          Risk breakdown:
            low:       $LOW
            medium:    $MEDIUM
            high:      $HIGH
            critical:  $CRITICAL

          Generated by: .github/workflows/sentinel-certify-all.yml
          Audit engine: lib/sentinel-audit.mjs (L1.5 + L1.6 + L2)" || echo "No changes to commit"

          # Push with retry (same race-condition handling as L2 sandbox)
          for i in 1 2 3 4 5; do
            if git push 2>&1; then
              echo "✓ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠ Push attempt $i failed — pulling rebase and retrying..."
            sleep $((i * 2))
            git pull --rebase origin master || {
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done
          echo "✗ Could not push after 5 attempts"
          exit 1

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-certify-${{ github.run_id }}
          path: |
            _data/sentinel_certificates/
          retention-days: 7
