name: Sentinel L4→L3 Integration Test
# ========================================
#
# Tests the L4→L3 integration by:
#   1. Running the L4 policy engine with simulated events
#   2. Feeding alerts into the L3 integration module
#   3. Verifying drift detection and revocation logic
#
# Q4 2026 roadmap item — L4 integration with L3.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC (after L3 re-audit at 02:00)

permissions:
  contents: read

jobs:
  test-l4-l3-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run L4 policy engine (simulated)
        run: |
          echo "Running L4 policy engine with simulated events..."
          python3 sentinel-l4/policy_engine.py

      - name: Test L4→L3 integration
        run: |
          echo "Testing L4→L3 integration module..."
          node -e "
          import('./aep-marketplace/lib/l4-l3-integration.mjs').then(mod => {
            const { runL4L3IntegrationCycle, shouldRevokeATCFromL4, integrateL4IntoL3 } = mod;
            
            // Simulated L4 alerts from the past week
            const l4Alerts = [
              { level: 'warn', category: 'network_drift', message: 'New connection to evil.com:4444', pid: 1234, timestamp: new Date().toISOString(), details: { domain: 'evil.com', port: 4444 } },
              { level: 'critical', category: 'credential_access', message: 'Access to ~/.ssh/id_rsa', pid: 1234, timestamp: new Date().toISOString(), details: { path: '~/.ssh/id_rsa' } },
            ];
            
            // L3 baseline from re-audit
            const l3Baseline = {
              network_domains: ['registry.npmjs.org', 'github.com'],
              processes: ['node', 'python3'],
              tools: ['search', 'get', 'list'],
            };
            
            // Run integration cycle
            const result = runL4L3IntegrationCycle({
              skill_id: 'mn-sub-90927',
              l3_baseline: l3Baseline,
              l4_alerts: l4Alerts,
              l3_report: null,
            });
            
            console.log('Integration result:');
            console.log(JSON.stringify(result.summary, null, 2));
            
            // Assertions
            if (!result.should_revoke) throw new Error('Expected should_revoke=true for credential_access');
            if (result.report.recommendation !== 'revoke') throw new Error('Expected recommendation=revoke');
            if (result.report.findings.length !== 2) throw new Error('Expected 2 findings');
            if (!result.report.drift_types.includes('credential')) throw new Error('Expected credential drift type');
            if (!result.report.drift_types.includes('network')) throw new Error('Expected network drift type');
            
            console.log('✓ All assertions passed!');
            console.log('  - L4 alerts integrated into L3 report: ✓');
            console.log('  - Critical alert triggers revocation: ✓');
            console.log('  - Drift types mapped correctly: ✓');
            console.log('  - New baseline generated: ✓');
          }).catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          "

      - name: Test no-alerts case
        run: |
          node -e "
          import('./aep-marketplace/lib/l4-l3-integration.mjs').then(mod => {
            const { runL4L3IntegrationCycle } = mod;
            
            const result = runL4L3IntegrationCycle({
              skill_id: 'mn-test-001',
              l3_baseline: { network_domains: [], processes: [], tools: [] },
              l4_alerts: [],
              l3_report: null,
            });
            
            if (result.should_revoke) throw new Error('Expected should_revoke=false with no alerts');
            if (result.report.drift_detected) throw new Error('Expected drift_detected=false');
            if (result.report.recommendation !== 'pass') throw new Error('Expected recommendation=pass');
            
            console.log('✓ No-alerts case: all assertions passed!');
          }).catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          "
