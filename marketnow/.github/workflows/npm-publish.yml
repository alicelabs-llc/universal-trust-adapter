name: Publish npm package with provenance

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check NPM_TOKEN
        id: check_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "⚠ NPM_TOKEN secret is not set."
            echo "  To enable: add NPM_TOKEN as a GitHub secret with your npm access token"
            echo "  1. Create at https://www.npmjs.com/settings/edgarfloresguerra2011-a11y/tokens"
            echo "  2. Add as GitHub secret: NPM_TOKEN"
            echo "  Skipping publish."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish with provenance
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd mcp-server
          npm install --no-audit --no-fund
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          sleep 5
          npm view marketnow-mcp version
          npm view marketnow-mcp mcpName
