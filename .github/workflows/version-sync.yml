# Version sync — anti-drift de documentación vs npm registry (3ª auditoría externa)
# El README y las superficies públicas NO son fuente manual de versiones:
# cada lunes se re-derivan del registry (dist-tags) y se commitea el parche.
# El check --check también lo puede llamar cualquier workflow manualmente.
name: Version sync (npm -> docs)

on:
  workflow_dispatch:
  schedule:
    # Lunes 08:00 UTC (03:00 America/Guayaquil)
    - cron: '0 8 * * 1'

permissions:
  contents: write

concurrency:
  group: version-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Re-derive doc versions from npm dist-tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA — OpenSSF Scorecard: Pinned-Actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sync versions (npm registry -> README/agent.json/stats stamp)
        run: |
          git config user.name 'marketnow-version-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/sync_npm_versions.py
          if git diff --quiet; then
            echo 'Sin drift — ninguna superficie diverge del registry.'
          else
            git add -A
            git commit -m 'chore(versions): sync npm dist-tags -> docs (automated)'
            git push
            echo 'Parche commiteado. Nota: este commit bot no dispara workflows (política GitHub).'
          fi
