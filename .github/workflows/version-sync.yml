# Version sync — anti-drift del README de UTA vs npm registry.
# (Split 2026-09-26) Las superficies de DATOS del sitio las sincroniza
# eddyflores100-lang/marketnow (version-sync propio). Este workflow toca
# SOLO el README de este repo: tabla de paquetes + badges.
#
# FIX 2026-09-28 (P2-b, validado con drift real): dos bugs encadenados.
#   1. bash: el payload JSON del contents API estaba mal entrecomillado
#      («syntax error near unexpected token '('», run 36368480666) —
#      ahora se construye con jq -n (sin interpolación de shell).
#   2. ruleset main-protection (status checks) bloquea git push (GH013)
#      y TAMBIEN puede bloquear el commit directo del contents API.
#      Camino definitivo si el PUT directo falla: rama no protegida
#      (las reglas solo cubren ~DEFAULT_BRANCH) -> PR -> checks ->
#      auto-merge (repo con allow_auto_merge=true).
name: Version sync (npm -> UTA README)

on:
  workflow_dispatch:
  schedule:
    # Lunes 08:00 UTC (03:00 America/Guayaquil)
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Re-derive UTA README versions from npm dist-tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA — OpenSSF Scorecard: Pinned-Actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sync versions (npm registry -> UTA README)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: alicelabs-llc/universal-trust-adapter
        run: |
          set -uo pipefail
          python3 scripts/sync-readme-versions.py
          if git diff --quiet; then
            echo 'Sin drift — el README no diverge del registry.'
            exit 0
          fi

          # ── Camino 1: contents API directo (JSON construido con jq) ──
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/README.md?ref=main" | jq -r .sha)
          B64=$(base64 -w0 README.md)
          PAYLOAD=$(jq -n --arg msg "chore(versions): sync npm dist-tags -> UTA README (automated)" \
            --arg content "$B64" --arg sha "$SHA" \
            '{message:$msg, content:$content, sha:$sha, branch:"main"}')
          CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/contents/README.md" \
            -d "$PAYLOAD")
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "README actualizado via contents API (HTTP $CODE)."
            exit 0
          fi
          echo "::notice::contents API HTTP $CODE — camino PR + auto-merge."
          head -c 300 /tmp/put.json || true

          # ── Camino 2: PR (rama libre de ruleset -> checks -> auto-merge) ──
          BRANCH="sync/npm-versions-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "marketnow-sync-bot"
          git config user.email "sync@marketnow.site"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "chore(versions): sync npm dist-tags -> UTA README (automated)"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(versions): sync npm dist-tags -> UTA README" \
            --body "Automated version sync (npm registry -> UTA README). Direct commit was blocked by main-protection ruleset; this PR runs the required status checks and auto-merges when green." 2>&1 || true)
          echo "PR: $PR_URL"
          if ! gh pr merge "$BRANCH" --auto --squash --delete-branch 2>&1; then
            echo "::notice::auto-merge no disponible — el PR queda abierto; se mezcla cuando los checks requeridos estén verdes."
          fi
