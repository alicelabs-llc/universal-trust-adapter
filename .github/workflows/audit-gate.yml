# Audit gate — Fase 4 del plan de remediación AUD-2026-0821-MN
# Anti-divergencia: en cada push/PR a main corre los 14 checks de consistencia
# (audit-status, PDF SHA-256, versiones, catálogo, npm sync, dumps prohibidos).
# El cron mensual además verifica PRODUCCIÓN en vivo (modo --live).
name: Audit gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: 'Verificar también producción (marketnow.site)'
        type: boolean
        default: false
  schedule:
    # Reauditoría programada: día 1 de cada mes, 09:00 UTC (04:00 America/Guayaquil)
    - cron: '0 9 1 * *'

permissions:
  contents: read

concurrency:
  group: audit-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gate:
    name: 14-point consistency gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketnow/aep-marketplace
    steps:
      # Pinned by commit SHA — OpenSSF Scorecard: Pinned-Actions
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Audit gate (14 checks — repo)
        run: node scripts/audit-gate.mjs
      - name: Audit gate (live production)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
        run: node scripts/audit-gate.mjs --live
      - name: Asset size gate (F-06 — dumps prohibidos + allowlist 50MB)
        run: node scripts/check-asset-sizes.mjs
