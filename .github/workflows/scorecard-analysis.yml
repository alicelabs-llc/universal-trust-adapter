# OpenSSF Scorecard — análisis público + badge
# Publica resultados en https://api.securityscorecards.dev (badge URL) y sube SARIF.
name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Semanal: domingo 04:30 UTC
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Necesario para subir resultados a la API pública de scorecard.dev
      security-events: write
      # Necesario para publicar resultados y firmarlos (OSSF)
      id-token: write
      contents: read
      actions: read
    steps:
      # Pinned by commit SHA — OpenSSF Scorecard: Pinned-Actions
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publica en https://api.securityscorecards.dev/repos/alicelabs-llc/universal-trust-adapter
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30
