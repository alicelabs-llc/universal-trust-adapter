# OpenSSF Scorecard — análisis público + badge
# Publica resultados en https://api.securityscorecards.dev (badge URL) y sube SARIF.
name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Semanal: domingo 04:30 UTC
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Necesario para subir resultados a la API pública de scorecard.dev
      security-events: write
      # Necesario para publicar resultados y firmarlos (OSSF)
      id-token: write
      contents: read
      actions: read
    steps:
      # Pinned by commit SHA — OpenSSF Scorecard: Pinned-Actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publica en https://api.securityscorecards.dev/repos/alicelabs-llc/universal-trust-adapter
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30
