# Dependency updates — OpenSSF Scorecard: Dependency-Update-Tool
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # GitHub Actions referenced by .github/workflows/* (pinning maintenance)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"

  # UTA monorepo workspace
  - package-ecosystem: npm
    directory: /uta-monorepo
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - uta-monorepo
    commit-message:
      prefix: "chore(deps)"
